name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oauth2_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oauth2_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      ACCESS_TOKEN_AUDIENCE: oauth2-demo-resource
      SESSION_SECRET: ci-session-secret-1234567890
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oauth2_demo
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build all
        run: npm run build
