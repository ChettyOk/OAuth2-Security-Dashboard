services:
  db:
    image: postgres:16-alpine
    container_name: oauth2-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oauth2_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oauth2_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oauth2-demo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/oauth2_demo
      ACCESS_TOKEN_AUDIENCE: oauth2-demo-resource
      SESSION_SECURE_COOKIE: "false"
      TRUST_PROXY: 1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
