services:
  - type: web
    name: oauth2-demo-app
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ACCESS_TOKEN_AUDIENCE
        value: oauth2-demo-resource
      - key: TRUST_PROXY
        value: 1
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 120
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: oauth2-demo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: oauth2-demo-db
    plan: starter
